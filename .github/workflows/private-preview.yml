name: Authorized private preview

on:
  push:
    branches: [private-preview-0.1.0]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter PUBLISH PRIVATE PREVIEW to authorize publishing'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'Publish Feylore 0.1.0 private preview') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH PRIVATE PREVIEW')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feylore
          POSTGRES_PASSWORD: preview-test-only
          POSTGRES_DB: feylore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U feylore" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Check existing package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(gh api -i orgs/feylore-media/packages/container/feylore 2>&1) || {
            if [[ "$status" == *"404"* ]]; then
              echo 'No accessible existing package; a new GHCR package defaults to private.'
              exit 0
            fi
            echo 'Unable to verify package visibility.'
            exit 1
          }
          visibility=$(printf '%s\n' "$status" | sed -n '/^{/,$p' | jq -r .visibility)
          if [ "$visibility" != private ]; then
            echo 'The existing package is not private; refusing to publish.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: feylore:private-preview-smoke
          build-args: |
            VERSION=0.1.0
            REVISION=${{ github.sha }}
            CHANNEL=private-preview
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test API and worker
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f preview-api preview-worker >/dev/null 2>&1 || true' EXIT
          for service in api worker; do
            if [ "$service" = api ]; then entry=index; port=3000; else entry=worker; port=3001; fi
            docker run -d --name "preview-$service" --network host \
              -e DATABASE_URL=postgresql://feylore:preview-test-only@localhost:5432/feylore \
              -e SESSION_SECRET=private-preview-test-secret-at-least-32-characters \
              -e APP_URL=http://localhost:3000 feylore:private-preview-smoke \
              node "dist/server/server/$entry.js"
            ready=false
            for attempt in {1..60}; do
              if curl --fail --silent "http://127.0.0.1:$port/health/ready" >/dev/null; then ready=true; break; fi
              echo "Waiting for port $port (attempt $attempt/60)"
              sleep 2
            done
            if [ "$ready" != true ]; then
              docker logs "preview-$service"
              exit 1
            fi
          done
          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest >/dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Publish private 0.1.0 preview
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/feylore-media/feylore:0.1.0
          build-args: |
            VERSION=0.1.0
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
            CHANNEL=private-preview
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Verify published package remains private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api orgs/feylore-media/packages/container/feylore --jq .visibility)" = private
