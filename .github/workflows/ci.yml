name: CI
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feylore
          POSTGRES_PASSWORD: feylore
          POSTGRES_DB: feylore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U feylore" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://feylore:feylore@localhost:5432/feylore
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t feylore:ci .
      - run: docker run --rm --entrypoint node feylore:ci -e "require('@node-rs/argon2').hash('test').then(() => process.exit(0))"
      - name: Smoke test API and worker
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f feylore-ci-api feylore-ci-worker >/dev/null 2>&1 || true' EXIT
          for service in api worker; do
            if [ "$service" = api ]; then entry=index; else entry=worker; fi
            docker run -d --name "feylore-ci-$service" --network host \
              -e DATABASE_URL="$DATABASE_URL" -e SESSION_SECRET="$SESSION_SECRET" \
              -e APP_URL=http://localhost:3000 feylore:ci \
              node "dist/server/server/$entry.js"
          done
          for port in 3000 3001; do
            ready=false
            for attempt in {1..60}; do
              if curl --fail --silent "http://127.0.0.1:$port/health/ready" >/dev/null; then ready=true; break; fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              docker logs feylore-ci-api
              docker logs feylore-ci-worker
              exit 1
            fi
          done
