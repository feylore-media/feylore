name: Docker distribution
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/feylore-media/feylore
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: feylore:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: feylore:scan
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
            CHANNEL=${{ github.ref == 'refs/heads/develop' && 'nightly' || (contains(github.ref, '-') && 'prerelease' || 'stable') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
