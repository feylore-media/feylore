
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable version tag such as v0.1.1"
            exit 1
          fi

      - name: Verify tagged commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify public visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/feylore-media/feylore --jq .private)" = false
          test "$(gh api orgs/feylore-media/packages/container/feylore --jq .visibility)" = public

  validate:
    name: Validate release
    needs: preflight
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and publish image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/feylore-media/feylore
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: feylore:scan
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
            CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          image-ref: feylore:scan
          scanners: vuln
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan image for secrets
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          image-ref: feylore:scan
          scanners: secret
          exit-code: '1'

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
            CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  release:
    name: Publish GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            compose.yaml \
            .env.example \
            --verify-tag \
            --generate-notes \
            --title "Feylore ${GITHUB_REF_NAME#v}" \
            --latest
