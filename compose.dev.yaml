services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feylore
      POSTGRES_PASSWORD: feylore
      POSTGRES_DB: feylore
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feylore -d feylore"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  database-dev:
