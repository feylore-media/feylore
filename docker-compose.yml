services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feylore
      POSTGRES_PASSWORD: feylore
      POSTGRES_DB: feylore
    ports:
      - "5432:5432"
    volumes:
      - feylore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feylore"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: node dist/server/index.js
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://feylore:feylore@postgres:5432/feylore
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      STORAGE_ROOT: /data/storage
      INGEST_ROOT: /ingest
      LIBRARY_BOOKS_ROOT: /libraries/books
      APP_URL: ${APP_URL:-http://localhost:3000}
      # AUTH_INTERNAL_ENABLED: "true"
      # AUTH_OIDC_ENABLED: "false"
      # AUTH_INTERNAL_RECOVERY_ENABLED: "true"
      # OIDC_ISSUER_URL: https://auth.example.com/realms/feylore
      # OIDC_CLIENT_ID: feylore
      # OIDC_CLIENT_SECRET:
      # OIDC_SCOPES: openid,profile,email
      # OIDC_AUTO_PROVISION: "false"
      # OIDC_ALLOW_PRIVATE_ISSUER: "false"
    volumes:
      - ./library/books:/libraries/books
      - ./ingest:/ingest
      - feylore_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: node dist/server/worker.js
    environment:
      DATABASE_URL: postgresql://feylore:feylore@postgres:5432/feylore
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      STORAGE_ROOT: /data/storage
      INGEST_ROOT: /ingest
      LIBRARY_BOOKS_ROOT: /libraries/books
    volumes:
      - ./library/books:/libraries/books
      - ./ingest:/ingest
      - feylore_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  feylore_pg:
  feylore_storage:
