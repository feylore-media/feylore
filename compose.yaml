services:
  feylore:
    image: ${FEYLORE_IMAGE:-ghcr.io/feylore-media/feylore:0.1.1}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_URL: ${APP_URL:?Set APP_URL}
      STORAGE_ROOT: /data/storage
      INGEST_ROOT: /ingest
      LIBRARY_BOOKS_ROOT: /libraries/books
      LIBRARY_AUDIOBOOKS_ROOT: /libraries/audiobooks
      LIBRARY_MUSIC_ROOT: /libraries/music
    ports:
      - "${FEYLORE_PORT:-3000}:3000"
    volumes:
      - feylore_storage:/data/storage
      - ${BOOKS_PATH:-./library/books}:/libraries/books
      - ${AUDIOBOOKS_PATH:-./library/audiobooks}:/libraries/audiobooks
      - ${PODCASTS_PATH:-./library/podcasts}:/libraries/podcasts
      - ${MUSIC_PATH:-./library/music}:/libraries/music
      - ${MOVIES_PATH:-./library/movies}:/libraries/movies
      - ${TV_PATH:-./library/tv}:/libraries/tv
      - ${TTRPG_PATH:-./library/ttrpg}:/libraries/ttrpg
      - ${INGEST_PATH:-./ingest}:/ingest
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feylore
      POSTGRES_DB: feylore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - feylore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feylore -d feylore"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  feylore_storage:
  feylore_pg:
