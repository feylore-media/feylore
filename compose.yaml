services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feylore
      POSTGRES_DB: feylore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feylore -d feylore"]
      interval: 5s
      timeout: 5s
      retries: 20

  app: &app
    image: ${FEYLORE_IMAGE:-ghcr.io/feylore-media/feylore:latest}
    restart: unless-stopped
    environment: &environment
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_URL: ${APP_URL:?Set APP_URL}
      LIBRARY_BOOKS_ROOT: /data/library/books
      LIBRARY_AUDIOBOOKS_ROOT: /data/library/audiobooks
      LIBRARY_MUSIC_ROOT: /data/library/music
    ports:
      - "${FEYLORE_PORT:-3000}:3000"
    volumes: &mounts
      - data:/data
      - ${MEDIA_ROOT:?Set MEDIA_ROOT}:/media:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "dist/server/server/worker.js"]
    ports: []
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  database:
  data:
